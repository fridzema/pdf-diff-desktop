name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Must already exist."
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          REF_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF_NAME#v}"
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $REF_NAME (version=$VERSION)"

      - name: Show Xcode version
        run: |
          ls /Applications | grep -i Xcode || true
          xcodebuild -version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core -> target

      - name: Build Rust + generate bindings
        run: make generate-bindings

      - name: Build app (ad-hoc signed)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project PdfDiffApp/PdfDiff.xcodeproj \
            -scheme PdfDiff \
            -configuration Release \
            -derivedDataPath build/ \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER:-1}" \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual

      - name: Package ZIP
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/PdfDiff.app"
          test -d "$APP_PATH" || { echo "App not found at $APP_PATH"; exit 1; }
          mkdir -p dist
          ZIP_NAME="PdfDiff-${VERSION}-arm64.zip"
          ditto -c -k --keepParent "$APP_PATH" "dist/${ZIP_NAME}"
          (cd dist && shasum -a 256 "${ZIP_NAME}" > "${ZIP_NAME}.sha256")
          echo "zip=dist/${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=dist/${ZIP_NAME}.sha256" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PdfDiff-${{ steps.version.outputs.version }}-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PdfDiff ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
          body: |
            ## PdfDiff ${{ steps.version.outputs.version }}

            Apple Silicon (arm64) build. Requires macOS 26 or later.

            **Note:** Build is ad-hoc signed (not notarized). On first launch,
            right-click the app and choose **Open** to bypass Gatekeeper, or run:

            ```
            xattr -dr com.apple.quarantine /Applications/PdfDiff.app
            ```

            Verify download:
            ```
            shasum -a 256 -c PdfDiff-${{ steps.version.outputs.version }}-arm64.zip.sha256
            ```
