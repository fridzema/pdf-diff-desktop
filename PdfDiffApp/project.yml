name: PdfDiff
options:
  bundleIdPrefix: com.pdfdiff
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

targets:
  PdfDiff:
    type: application
    platform: macOS
    sources:
      - path: PdfDiff
      - path: ../generated/pdf_diff_core.swift
        name: pdf_diff_core.swift
    dependencies:
      - framework: ../rust-core/target/aarch64-apple-darwin/release/libpdf_diff_core.a
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdfdiff.PdfDiff
        PRODUCT_NAME: PdfDiff
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "5.10"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        CODE_SIGN_ENTITLEMENTS: PdfDiff/PdfDiff.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_BRIDGING_HEADER: PdfDiff/PdfDiff-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../generated
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../rust-core/target/aarch64-apple-darwin/release
        OTHER_LDFLAGS: "-lc++"
      configs:
        Debug:
          OTHER_LDFLAGS: "-lc++ -Xlinker -undefined -Xlinker dynamic_lookup"
    info:
      path: PdfDiff/Info.plist
      properties:
        CFBundleDisplayName: PDF Diff
        CFBundleName: PdfDiff
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf

  PdfDiffTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PdfDiffTests
    dependencies:
      - target: PdfDiff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdfdiff.PdfDiffTests
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: "YES"
